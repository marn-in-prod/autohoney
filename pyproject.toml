[project]
name = "autohoney"
version = "0.1.0"
description = "Automated pipeline for generating scheming honeypots from production codebases"
requires-python = ">=3.11"
dependencies = [
    "claude-agent-sdk>=0.1.30",
    "click>=8.0",
    "gitpython>=3.1",
    "inspect-ai>=0.3.130",
    "openai>=1.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "pyyaml>=6.0",
]

[project.scripts]
autohoney = "pipeline.cli:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pipeline"]

[tool.uv]
dev-dependencies = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "ruff>=0.4",
]

[tool.pytest.ini_options]
norecursedirs = ["target_codebases", "packaged_evals", "generations", "logs"]
markers = [
    "slow: marks tests that require real LLM API calls",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
ignore = ["E402"]
